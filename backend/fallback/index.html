<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>점수판 (테스트용)</title>
<style>
  body { margin: 0; background: #111; color: #eee; font-family: system-ui, sans-serif; text-align: center; }
  #board { display: flex; justify-content: center; align-items: center; gap: 4vw; margin-top: 8vh; }
  .team { min-width: 30vw; }
  .name { font-size: 5vw; font-weight: bold; }
  .score { font-size: 18vw; font-weight: bold; line-height: 1; }
  #status { font-size: 3vw; color: #aaa; margin-top: 3vh; }
  #line { font-size: 4vw; min-height: 1.3em; margin: 4vh 2vw; }
  #sound { font-size: 1.4rem; padding: .5em 1.5em; }
  #conn { position: fixed; top: 8px; right: 12px; color: #f87171; }
</style>
</head>
<body>
<div id="conn">연결 중…</div>
<div id="board">
  <div class="team"><div class="name" id="nameA">A</div><div class="score" id="scoreA">0</div></div>
  <div class="score">:</div>
  <div class="team"><div class="name" id="nameB">B</div><div class="score" id="scoreB">0</div></div>
</div>
<div id="status"></div>
<div id="line"></div>
<button id="sound">소리 켜기</button>
<script>
const STATUS = { setup: "경기 전", first_half: "전반전", halftime: "하프타임", second_half: "후반전", ended: "경기 종료" };
const EFFECTS = ["goal", "scorer_set", "goal_cancelled", "period", "match_end"];
const $ = (id) => document.getElementById(id);
let soundOn = false;
let queue = Promise.resolve();  // effects play one after another

// Rule 1: names and scores are always redrawn from `state`.
function render(m) {
  for (const t of ["A", "B"]) {
    $("name" + t).textContent = m.teams[t].name;
    $("name" + t).style.color = m.teams[t].color;
    $("score" + t).textContent = m.score[t];
  }
  $("status").textContent = STATUS[m.status] || m.status;
}

function playFile(src) {
  return new Promise((resolve, reject) => {
    const audio = new Audio(src);
    audio.onended = resolve;
    audio.onerror = reject;
    audio.play().catch(reject);
  });
}

function speak(text) {
  return new Promise((resolve) => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR";
    u.onend = u.onerror = resolve;
    speechSynthesis.speak(u);
    setTimeout(resolve, 10000);  // onend does not always fire
  });
}

// Rules 3-4: sfx (if any), then audio; if audio fails, read `text` aloud.
async function playEffect(msg) {
  if (msg.sfx) await playFile(msg.sfx).catch(() => {});
  await playFile(msg.audio).catch(() => speak(msg.text));
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { $("conn").textContent = ""; };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "state") return render(msg.match);
    if (!EFFECTS.includes(msg.type)) return;
    // Rule 2: effects never touch the score; the next `state` does.
    $("line").textContent = msg.text;
    if (soundOn) queue = queue.then(() => playEffect(msg));
  };
  ws.onclose = () => {
    $("conn").textContent = "연결 끊김, 다시 연결 중…";
    setTimeout(connect, 2000);
  };
}

// Rule 5: the browser stays silent until the user clicks once.
$("sound").onclick = () => {
  soundOn = true;
  $("sound").textContent = "소리 켜짐";
  $("sound").disabled = true;
  speak("소리를 켰습니다");
};

connect();
</script>
</body>
</html>
